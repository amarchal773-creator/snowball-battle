<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowball Battle - Remastered 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Quicksand:wght@500&display=swap');
        
        body { margin: 0; overflow: hidden; font-family: 'Quicksand', sans-serif; background-color: #001220; }
        
        /* Effet de givre sur les bords */
        #frost { 
            position: absolute; width: 100%; height: 100%; pointer-events: none; 
            box-shadow: inset 0 0 150px rgba(255,255,255,0.15); 
            z-index: 4; 
        }

        /* Menu Modernisé */
        #overlay { 
            position: absolute; width: 100%; height: 100%; display: flex; 
            align-items: center; justify-content: center; 
            background: radial-gradient(circle, rgba(10, 25, 50, 0.6) 0%, rgba(2, 5, 12, 0.9) 100%); 
            backdrop-filter: blur(15px); z-index: 10; 
        }

        .menu-card { 
            background: rgba(255, 255, 255, 0.05); padding: 60px; border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; color: white; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-family: 'Mountains of Christmas', cursive; font-size: 72px; text-shadow: 0 0 30px #3498db; margin: 0 0 10px 0; letter-spacing: 2px; }

        .subtitle { font-size: 18px; color: #8ed1fc; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 4px; }

        button { 
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); 
            border: none; padding: 18px 60px; 
            font-size: 32px; font-family: 'Mountains of Christmas', cursive; color: #fff; 
            border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3); transition: 0.3s all;
            border: 2px solid rgba(255,255,255,0.2);
        }
        button:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 15px 30px rgba(231, 76, 60, 0.4); filter: brightness(1.1); }
        button:active { transform: translateY(2px); box-shadow: 0 5px 10px rgba(231, 76, 60, 0.4); }

        /* HUD - Style "Glassmorphism" */
        #hud { position: absolute; top: 30px; left: 30px; color: white; z-index: 5; display: none; }
        .hud-box { 
            background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #timer-box { 
            position: absolute; top: 30px; right: 30px; font-size: 50px; 
            font-family: 'Mountains of Christmas'; color: #fff; z-index: 5; 
            display: none; text-shadow: 0 0 15px rgba(231, 76, 60, 0.8); 
        }
        
        .ammo-container { margin-top: 15px; }
        .ammo-bar { width: 180px; height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        #ammo-fill { height: 100%; background: linear-gradient(90deg, #00d2ff, #3a7bd5); width: 100%; transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 24px; height: 24px; 
            border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; 
            transform: translate(-50%, -50%); display: none; pointer-events: none; 
        }
        #crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div id="frost"></div>
    <div id="overlay">
        <div class="menu-card">
            <h1 id="menu-title">SNOWBALL BATTLE</h1>
            <div class="subtitle">Remastered Edition</div>
            <div id="score-display" style="font-size: 28px; color: #f1c40f; margin-bottom: 30px; display: none; font-weight: bold;"></div>
            <button id="btn-play">COMMENCER</button>
            <p style="color: rgba(255,255,255,0.6); margin-top: 30px; font-size: 14px;">
                <b style="color: #fff">ZQSD</b> se déplacer | <b style="color: #fff">E</b> ramasser neige | <b style="color: #fff">CLIC</b> lancer
            </p>
        </div>
    </div>

    <div id="hud">
        <div class="hud-box">
            <div style="font-family: 'Mountains of Christmas'; font-size: 36px; color: #f1c40f;">Score: <span id="current-score">0</span></div>
            <div class="ammo-container">
                <div style="display:flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">
                    <span>Munitions</span>
                    <span><span id="ammo-text">5</span> / 15</span>
                </div>
                <div class="ammo-bar"><div id="ammo-fill"></div></div>
            </div>
        </div>
    </div>
    <div id="timer-box">60s</div>
    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'controls';

        // --- MOTEUR DE RENDU ET AMBIANCE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1428); // Nuit bleutée
        scene.fog = new THREE.FogExp2(0x0a1428, 0.015); // Brouillard atmosphérique
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // Ombres portées
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ÉCLAIRAGE ---
        const moonLight = new THREE.DirectionalLight(0x8ed1fc, 1.5);
        moonLight.position.set(50, 100, 50);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        scene.add(moonLight);

        const ambient = new THREE.AmbientLight(0x203050, 0.5);
        scene.add(ambient);

        // --- TERRAIN ---
        const groundGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- SYSTÈME DE NEIGE AMBIANTE ---
        const snowCount = 1500;
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = new Float32Array(snowCount * 3);
        for(let i=0; i<snowCount*3; i+=3) {
            snowPos[i] = Math.random() * 200 - 100;
            snowPos[i+1] = Math.random() * 100;
            snowPos[i+2] = Math.random() * 200 - 100;
        }
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        const snowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6 });
        const snowParticles = new THREE.Points(snowGeo, snowMat);
        scene.add(snowParticles);

        // --- JOUEUR ET BRAS ---
        const armGroup = new THREE.Group();
        const arm = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.2, 0.8), 
            new THREE.MeshStandardMaterial({ color: 0xc21807 })
        );
        arm.position.set(0.4, -0.4, -0.5);
        arm.castShadow = true;
        armGroup.add(arm); 
        camera.add(armGroup); 
        scene.add(camera);

        // --- VARIABLES DE JEU ---
        let score = 0, ammo = 5, timeLeft = 60, gameActive = false, isGathering = false;
        const snowballs = [], snowBlocks = [], targets = [], explosions = [];

        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('btn-play').addEventListener('click', () => {
            if(timeLeft <= 0) { score = 0; ammo = 10; timeLeft = 60; updateHUD(); }
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('timer-box').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            gameActive = true;
        });

        controls.addEventListener('unlock', () => {
            gameActive = false;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('menu-title').innerText = timeLeft <= 0 ? "PARTIE TERMINÉE" : "PAUSE";
            document.getElementById('score-display').innerText = "Score : " + score + " pts";
            document.getElementById('score-display').style.display = 'block';
            document.getElementById('btn-play').innerText = timeLeft <= 0 ? "REJOUER" : "REPRENDRE";
        });

        // --- CRÉATION DES OBJETS ---
        function createSnowman(type = "normal") {
            const group = new THREE.Group();
            const color = type === "gold" ? 0xffcc00 : 0xffffff;
            const mat = new THREE.MeshStandardMaterial({color: color, roughness: 0.7});
            
            const b1 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 12), mat);
            const b2 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), mat); b2.position.y = 1.1;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), mat); head.position.y = 1.8;
            
            group.add(b1, b2, head);
            b1.castShadow = b2.castShadow = head.castShadow = true;
            group.userData = { type: type };
            group.position.set(Math.random()*120-60, 0.8, Math.random()*120-60);
            scene.add(group); targets.push(group);
        }

        function createBlock() {
            const b = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.2, 1.2), 
                new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x00d2ff, emissiveIntensity: 0.2 })
            );
            b.castShadow = true;
            b.position.set(Math.random()*100-50, 0.6, Math.random()*100-50);
            scene.add(b); snowBlocks.push(b);
        }

        function createExplosion(pos, color = 0xffffff) {
            const count = 6;
            const particles = [];
            for(let i=0; i<count; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, 0.1),
                    new THREE.MeshBasicMaterial({ color: color, transparent: true })
                );
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2, (Math.random()-0.5)*0.2);
                p.userData.life = 1.0;
                scene.add(p);
                particles.push(p);
            }
            explosions.push({ parts: particles });
        }

        for(let i=0; i<15; i++) createSnowman(Math.random() > 0.9 ? "gold" : "normal");
        for(let i=0; i<8; i++) createBlock();

        // --- ACTIONS ---
        function harvest() {
            if (!gameActive || isGathering || ammo >= 15) return;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(snowBlocks);
            
            if (hits.length > 0 && hits[0].distance < 5) {
                isGathering = true;
                const block = hits[0].object;
                const startTime = performance.now();
                const duration = 600; 

                function anim(t) {
                    const progress = Math.min((t - startTime) / duration, 1);
                    const curve = Math.sin(progress * Math.PI);
                    armGroup.rotation.x = curve * -1.2;
                    camera.position.y = 1.7 - (curve * 0.5);
                    if (progress < 1) requestAnimationFrame(anim);
                    else {
                        camera.position.y = 1.7; armGroup.rotation.x = 0; isGathering = false;
                        ammo = Math.min(15, ammo + 3);
                        scene.remove(block);
                        snowBlocks.splice(snowBlocks.indexOf(block), 1);
                        updateHUD();
                        setTimeout(createBlock, 3000);
                    }
                }
                requestAnimationFrame(anim);
            }
        }

        window.addEventListener('mousedown', () => {
            if (!gameActive || ammo <= 0 || isGathering) return;
            ammo--; updateHUD();
            
            // Animation de recul
            armGroup.position.z = 0.2;
            setTimeout(() => armGroup.position.z = 0, 100);

            const ball = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 8, 8), 
                new THREE.MeshStandardMaterial({color: 0xffffff})
            );
            ball.castShadow = true;
            ball.position.copy(camera.position).y -= 0.2;
            
            const dir = new THREE.Vector3(); 
            camera.getWorldDirection(dir);
            ball.userData.vel = dir.multiplyScalar(1.6);
            scene.add(ball); snowballs.push(ball);
        });

        function updateHUD() {
            document.getElementById('ammo-text').innerText = ammo;
            document.getElementById('ammo-fill').style.width = (ammo/15)*100 + "%";
            document.getElementById('current-score').innerText = score;
            document.getElementById('timer-box').innerText = Math.ceil(timeLeft) + "s";
        }

        // --- BOUCLE PRINCIPALE ---
        let keys = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => { 
            if(e.code==='KeyW') keys.w=true; if(e.code==='KeyS') keys.s=true;
            if(e.code==='KeyA') keys.a=true; if(e.code==='KeyD') keys.d=true;
            if(e.code==='KeyE') harvest();
        });
        window.addEventListener('keyup', (e) => { 
            if(e.code==='KeyW') keys.w=false; if(e.code==='KeyS') keys.s=false;
            if(e.code==='KeyA') keys.a=false; if(e.code==='KeyD') keys.d=false; 
        });

        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - lastTime) / 1000;
            
            if (gameActive) {
                timeLeft -= delta;
                if(timeLeft <= 0) { timeLeft = 0; controls.unlock(); }

                const spd = 35 * delta;
                if(!isGathering) {
                    if(keys.w) controls.moveForward(spd); if(keys.s) controls.moveForward(-spd);
                    if(keys.a) controls.moveRight(-spd); if(keys.d) controls.moveRight(spd);
                }

                // Animation neige
                const posArr = snowParticles.geometry.attributes.position.array;
                for(let i=1; i<posArr.length; i+=3) {
                    posArr[i] -= 0.1;
                    if(posArr[i] < 0) posArr[i] = 100;
                }
                snowParticles.geometry.attributes.position.needsUpdate = true;

                // Boules de neige
                for(let i = snowballs.length - 1; i >= 0; i--) {
                    const b = snowballs[i];
                    b.position.add(b.userData.vel);
                    b.userData.vel.y -= 0.03;
                    
                    if(b.position.y < 0) {
                        createExplosion(b.position);
                        scene.remove(b); snowballs.splice(i, 1); continue;
                    }

                    for(let j = targets.length - 1; j >= 0; j--) {
                        const t = targets[j];
                        if(b.position.distanceTo(t.position) < 1.4) {
                            const isGold = t.userData.type === "gold";
                            score += (isGold ? 500 : 100);
                            createExplosion(t.position, isGold ? 0xf1c40f : 0xffffff);
                            scene.remove(t); targets.splice(j, 1);
                            scene.remove(b); snowballs.splice(i, 1);
                            updateHUD();
                            setTimeout(() => createSnowman(Math.random() > 0.85 ? "gold" : "normal"), 2000);
                            break;
                        }
                    }
                }

                // Particules d'explosion
                for(let i = explosions.length - 1; i >= 0; i--) {
                    const exp = explosions[i];
                    exp.parts.forEach((p, idx) => {
                        p.position.add(p.userData.vel);
                        p.userData.life -= 0.03;
                        p.material.opacity = p.userData.life;
                        if(p.userData.life <= 0) { scene.remove(p); exp.parts.splice(idx, 1); }
                    });
                    if(exp.parts.length === 0) explosions.splice(i, 1);
                }
            }
            renderer.render(scene, camera);
            lastTime = time;
        }
        
        camera.position.set(0, 1.7, 5);
        animate();
        updateHUD();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
