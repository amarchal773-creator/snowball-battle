<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowball Battle - Pro Edition</title>
    <style>
        /* IMPORT DES POLICES */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&family=Mountains+of+Christmas:wght@700&display=swap');
        
        body { margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; background-color: #050a14; }
        
        /* OVERLAY GLASSMORPHISM (MENU) */
        #overlay { 
            position: absolute; width: 100%; height: 100%; display: flex; 
            align-items: center; justify-content: center; 
            background: radial-gradient(circle at center, rgba(15, 32, 64, 0.4) 0%, #050a14 100%); 
            backdrop-filter: blur(20px); z-index: 10; transition: opacity 0.5s;
        }

        .menu-card { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 60px 80px; border-radius: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-align: center; color: white; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative; overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { 
            font-family: 'Mountains of Christmas', cursive; 
            font-size: 80px; margin: 0; 
            background: linear-gradient(to bottom, #ffffff, #add8e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
            line-height: 1;
        }

        .subtitle {
            text-transform: uppercase; letter-spacing: 8px; font-size: 14px;
            color: #3498db; margin-bottom: 40px; font-weight: 800;
        }

        /* BOUTON MODERNE */
        button { 
            background: #ffffff; color: #050a14;
            border: none; padding: 20px 60px; 
            font-size: 24px; font-weight: 800; 
            border-radius: 15px; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative; z-index: 2;
        }

        button:hover { 
            transform: scale(1.05) translateY(-5px); 
            box-shadow: 0 20px 40px rgba(52, 152, 219, 0.4);
            background: #3498db; color: white;
        }

        /* INDICATION TOUCHES */
        .controls-hint {
            margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.4);
            display: flex; gap: 20px; justify-content: center;
        }

        .key {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px; border-radius: 5px; color: white; font-weight: 800;
        }

        /* HUD EN JEU */
        #hud { position: absolute; top: 30px; left: 30px; color: white; z-index: 5; display: none; }
        .hud-box { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); 
        }
        
        #timer-box { 
            position: absolute; top: 30px; right: 30px; font-size: 50px; 
            font-family: 'Mountains of Christmas'; color: #fff; z-index: 5; 
            display: none; text-shadow: 0 0 15px rgba(52, 152, 219, 0.5); 
        }

        .ammo-bar { width: 180px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 10px; overflow: hidden; }
        #ammo-fill { height: 100%; background: #3498db; width: 100%; transition: 0.3s; }
        
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; 
            border: 1px solid rgba(255,255,255,0.5); border-radius: 50%; 
            transform: translate(-50%, -50%); display: none; pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="menu-card">
            <div class="subtitle">Ultimate Snow Experience</div>
            <h1 id="menu-title">SNOWBALL<br>BATTLE</h1>
            <div id="score-display" style="font-size: 24px; color: #f1c40f; margin: 20px 0; display: none; font-weight: 800;"></div>
            
            <div style="margin-top: 40px;">
                <button id="btn-play">START GAME</button>
            </div>

            <div class="controls-hint">
                <span><span class="key">Z Q S D</span> MOVE</span>
                <span><span class="key">E</span> COLLECT</span>
                <span><span class="key">CLICK</span> SHOOT</span>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="hud-box">
            <div style="font-size: 28px; font-weight: 800;">SCORE: <span id="current-score" style="color: #3498db;">0</span></div>
            <div style="margin-top: 10px; font-size: 10px; letter-spacing: 2px; opacity: 0.6;">AMMO: <span id="ammo-text">5</span>/15</div>
            <div class="ammo-bar"><div id="ammo-fill"></div></div>
        </div>
    </div>
    <div id="timer-box">60s</div>
    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "controls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'controls';

        // --- SETUP SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a14);
        scene.fog = new THREE.FogExp2(0x050a14, 0.02);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LUMIÈRES ---
        const moonLight = new THREE.DirectionalLight(0xffffff, 1.2);
        moonLight.position.set(50, 100, 50);
        moonLight.castShadow = true;
        scene.add(moonLight);
        scene.add(new THREE.AmbientLight(0x203050, 0.6));

        // --- SOL ET NEIGE ---
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(400, 400),
            new THREE.MeshStandardMaterial({ color: 0xeeeeee })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const snowGeo = new THREE.BufferGeometry();
        const snowPos = new Float32Array(2000 * 3);
        for(let i=0; i<6000; i++) snowPos[i] = (Math.random()-0.5) * 200;
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        const snowParticles = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 }));
        scene.add(snowParticles);

        // --- BRAS DU JOUEUR ---
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.7), new THREE.MeshStandardMaterial({color: 0x3498db}));
        arm.position.set(0.4, -0.4, -0.5);
        camera.add(arm);
        scene.add(camera);

        // --- LOGIQUE DE JEU ---
        let score = 0, ammo = 5, timeLeft = 60, gameActive = false;
        const snowballs = [], targets = [], blocks = [];

        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('btn-play').addEventListener('click', () => {
            if(timeLeft <= 0) { score = 0; ammo = 10; timeLeft = 60; updateHUD(); }
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
            document.getElementById('hud').style.display = 'block';
            document.getElementById('timer-box').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            gameActive = true;
        });

        controls.addEventListener('unlock', () => {
            gameActive = false;
            document.getElementById('overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('overlay').style.opacity = '1', 10);
            document.getElementById('menu-title').innerHTML = timeLeft <= 0 ? "GAME OVER" : "PAUSED";
            document.getElementById('score-display').innerText = "FINAL SCORE: " + score;
            document.getElementById('score-display').style.display = 'block';
            document.getElementById('btn-play').innerText = timeLeft <= 0 ? "TRY AGAIN" : "RESUME";
        });

        function createTarget() {
            const t = new THREE.Mesh(new THREE.SphereGeometry(0.7), new THREE.MeshStandardMaterial({color: 0xffffff}));
            t.position.set((Math.random()-0.5)*80, 0.7, (Math.random()-0.5)*80);
            scene.add(t); targets.push(t);
        }
        for(let i=0; i<15; i++) createTarget();

        function updateHUD() {
            document.getElementById('ammo-text').innerText = ammo;
            document.getElementById('ammo-fill').style.width = (ammo/15)*100 + "%";
            document.getElementById('current-score').innerText = score;
            document.getElementById('timer-box').innerText = Math.ceil(timeLeft) + "s";
        }

        // --- INPUTS & BOUCLE ---
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        window.addEventListener('mousedown', () => {
            if(!gameActive || ammo <= 0) return;
            ammo--; updateHUD();
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshStandardMaterial({color: 0xffffff}));
            ball.position.copy(camera.position);
            const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            ball.userData.vel = dir.multiplyScalar(1.5);
            scene.add(ball); snowballs.push(ball);
        });

        function animate() {
            requestAnimationFrame(animate);
            if(gameActive) {
                timeLeft -= 0.016;
                if(timeLeft <= 0) { timeLeft = 0; controls.unlock(); }

                if(keys['KeyW']) controls.moveForward(0.3);
                if(keys['KeyS']) controls.moveForward(-0.3);
                if(keys['KeyA']) controls.moveRight(-0.3);
                if(keys['KeyD']) controls.moveRight(0.3);

                snowballs.forEach((b, i) => {
                    b.position.add(b.userData.vel);
                    b.userData.vel.y -= 0.02;
                    if(b.position.y < 0) { scene.remove(b); snowballs.splice(i, 1); }
                    targets.forEach((t, j) => {
                        if(b.position.distanceTo(t.position) < 0.8) {
                            score += 100; updateHUD();
                            scene.remove(t); targets.splice(j, 1);
                            scene.remove(b); snowballs.splice(i, 1);
                            setTimeout(createTarget, 2000);
                        }
                    });
                });
            }
            renderer.render(scene, camera);
        }

        camera.position.y = 1.7;
        animate();
    </script>
</body>
</html>
